[FAIL-SAFE-MONITOR]
algo_type monitor
sampling 1
sensor VIRTUAL-FAIL-SAFE-TJ
thresholds 100000 105000
thresholds_clr 95000 100000
actions gpu+camera+camcorder+cdsp_sw+cpu-cluster1+cpu-cluster2+modem_nr_scg_dsc gpu+camera+camcorder+cdsp_sw+cpu-cluster0+cpu-cluster1+cpu-cluster2+modem_nr_scg_dsc++

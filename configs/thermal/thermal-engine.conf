#################################################
# BATTERY SOC
#################################################

[BAT_SOC]
algo_type simulated
path /sys/class/power_supply/battery/capacity
polling 10000

#################################################
# MAIN VIRTUAL SENSOR
#################################################

[VIRTUAL-SENSOR0]
algo_type Virtual
sensors cpu_therm battery charger_therm0 wifi_therm pa_therm0 pa_therm1 quiet_therm
weight 260 180 120 200 60 140 40
polling 1000
weight_sum 1000
compensation 800

#################################################
# SENSOR MONITOR (Feedback Loop)
#################################################

[MONITOR-SENSOR0]
algo_type monitor
sensor VIRTUAL-SENSOR0
device VIRTUAL-SENSOR0
polling 1000

trig 32000 38000 44000 50000 56000
clr  28000 34000 40000 46000 52000

target 10000 7000 4000 2000 500

#################################################
# LITTLE CLUSTER (cpu-cluster0: cores 0-2)
#################################################

[SS-CPU-LITTLE]
algo_type ss
sensor VIRTUAL-SENSOR0
device cpu-cluster0
polling 1000

trig 40000 43000 46000 50000 54000 58000
clr  37000 40000 43000 47000 51000 55000

# Targets mapped to scaling frequency steps
target 1900800 1708800 1478400 1344000 1113600 902400

#################################################
# MID CLUSTER (cpu-cluster1: cores 3-6)
#################################################

[SS-CPU-MID]
algo_type ss
sensor VIRTUAL-SENSOR0
device cpu-cluster1
polling 1000

trig 38000 41000 44000 48000 52000 56000
clr  35000 38000 41000 45000 49000 53000

target 2572800 2361600 2073600 1824000 1593600 1286400

#################################################
# BIG CLUSTER (cpu-cluster2: core 7)
#################################################

[SS-CPU-BIG]
algo_type ss
sensor VIRTUAL-SENSOR0
device cpu-cluster2
polling 1000

trig 37000 40000 43000 47000 52000 57000
clr  34000 37000 40000 44000 49000 54000

target 2803200 2668800 2457600 2150400 1766400 1324800

#################################################
# GPU THROTTLING
#################################################

[SS-GPU]
algo_type ss
sensor VIRTUAL-SENSOR0
device gpu
polling 1000

trig 40000 44000 48000 53000 58000 63000
clr  37000 41000 45000 50000 55000 60000

target 1000000000 900000000 835000000 736000000 633000000 500000000

#################################################
# BATTERY THERMAL & CHARGE CURRENT (SIC)
#################################################

[MONITOR-BAT]
algo_type monitor
sensor VIRTUAL-SENSOR0
device battery
polling 1000

trig 38000 42000 46000 50000 54000
clr  35000 39000 43000 47000 51000

target 500 700 1000 1400 1800

[SIC-BAT]
algo_type sic
sensor VIRTUAL-SENSOR0
device constant_charge_current
polling 1000

proportion 0

trig 15000 38000 45000 52000 58000
clr  14000 35000 42000 49000 55000

target 6000000 5500000 4500000 3500000 2000000

ks 0 0 6500000 6300000 6000000 6000000 6000000 6000000
ki 0 0 100000 100000 100000 100000 100000 100000
kc 0 0 0 0 0 0 0 0

max 6000000 5500000 4500000 3500000 2000000
min 3000000 2000000 1000000 1000000 1000000

#################################################
# PERIPHERALS & HARDWARE LIMITS
#################################################

[MONITOR-TEMP_STATE]
algo_type monitor
sensor VIRTUAL-SENSOR0
device temp_state
polling 1000

trig 46000 55000
clr  42000 50000

target 110300000 112520004

[MONITOR-FLASH]
algo_type monitor
sensor flash_therm
device temp_state
polling 1000

trig 60000 68000
clr  55000 63000

target 110100003 110100004

[MONITOR-BCL]
algo_type monitor
sensor BAT_SOC
device cpu-cluster0+cpu-cluster1
polling 5000

trig 1 3
clr  2 4

target 940800+1497600 \
       1708800+1920000

reverse 1

[MONITOR-BACKLIGHT]
algo_type monitor
sensor VIRTUAL-SENSOR0
device thermal_max_brightness
polling 1000

trig 42000 48000 53000
clr  39000 45000 50000

target 200 160 100

[MONITOR-PARALLEL-TO-SERIAL]
algo_type monitor
sensor VIRTUAL-SENSOR0
device market_download_limit
polling 5000

trig 45000
clr  40000

target 1

[MONITOR-MODEM-5GTO4G]
algo_type monitor
sensor VIRTUAL-SENSOR0
device modem_limit
polling 5000

trig 50000
clr  45000

target 1

[MONITOR-WIFI-LIMIT]
algo_type monitor
sensor VIRTUAL-SENSOR0
device wifi_limit
polling 3000

trig 45000 53000
clr  42000 50000

target 1000020000 1000030800

[MONITOR-MODEM-LEVEL]
algo_type monitor
sensor VIRTUAL-SENSOR0
device modem_level
polling 5000

trig 45000 55000
clr  42000 52000

target 7 9

[MONITOR-NPU]
algo_type monitor
sensor VIRTUAL-SENSOR0
device cdsp
polling 1000

trig 42000 50000 58000
clr  39000 47000 55000

target 2 4 7


##################################################################
# CRITICAL STOCK PROTECTION: HARDWARE SILICON SHUTDOWN NETS (Raw Millidegrees)
##################################################################

[VIRTUAL-PMIC-ALARM-SHUTDOWN]
algo_type virtual
sensors pm8550vs_c_tz pm8010m_tz pm8010n_tz pmr735a_tz pm8550ve_tz pm7550ba_tz pmxr2230_tz
weights
trip_sensor pm8550vs_c_tz pm8010m_tz pm8010n_tz pmr735a_tz pm8550ve_tz pm7550ba_tz pmxr2230_tz
trip_sensor_logic || || || || || ||
thresholds 115000 115000 115000 115000 115000 115000 115000
thresholds_clr 100000 100000 100000 100000 100000 100000 100000
sampling 10
math 2

[VIRTUAL-MISC-TJ-SHUTDOWN]
algo_type virtual
sensors aoss-0 aoss-1 aoss-2 ddr
weights
trip_sensor aoss-0 aoss-1 aoss-2 ddr
trip_sensor_logic || || ||
thresholds 115000 115000 115000 115000
thresholds_clr 100000 100000 100000 100000
sampling 10
math 2

